#:schema https://supabase.com/schemas/config/v1.json
# Local CLI configuration. No hosted project is linked or configured here.
project_id = "ai-team-project"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
# Reference labels are versioned in migrations, not an optional seed file.
enabled = false
